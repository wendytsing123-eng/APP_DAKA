<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAKA</title>
<style>
:root{--bg:#f7f7f7;--card:#fff;--tx:#222;--sub:#999;--ac:#f2b000;--sf:#f2f2f2;--up:#e5484d;--dn:#30a46c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1c1e;--tx:#eee;--sub:#888;--sf:#2a2a2c}}
:root[data-theme="dark"]{--bg:#111;--card:#1c1c1e;--tx:#eee;--sub:#888;--sf:#2a2a2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,"PingFang SC","Helvetica Neue",sans-serif;max-width:560px;margin:0 auto;padding-bottom:90px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.title{font-size:18px;font-weight:600;border:0;background:none;color:var(--tx);width:34%;font-family:inherit}
.seg{display:flex;border:1px solid var(--ac);border-radius:20px;padding:2px}
.seg button{border:0;background:none;color:var(--sub);padding:7px 20px;border-radius:18px;font-size:16px;font-family:inherit}
.seg button.on{background:var(--ac);color:#fff}
.ic{border:0;background:none;color:var(--tx);font-size:22px;padding:4px 8px}
.pad{padding:0 16px}
.nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;font-size:20px;font-weight:600}
.nav b{font-size:24px;padding:0 10px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:8px}
.cal .h{color:var(--sub);font-size:13px;padding-bottom:4px}
.d{height:38px;width:38px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.d.o{color:#bbb}.d.has{background:var(--ac);color:#fff}.d.today{background:#333;color:#fff}
.list{background:var(--card);border-radius:22px 22px 0 0;margin-top:16px;padding:10px 16px}
.day{margin:14px 0 6px;font-size:18px;font-weight:600}
.item{display:flex;justify-content:space-between;background:var(--sf);border-radius:12px;padding:14px;margin:6px 0}
.item small{color:var(--ac);margin-right:10px}
.item i{color:var(--sub);font-style:normal;font-size:13px}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:34px;box-shadow:0 4px 14px #0004}
.pill{display:flex;background:var(--sf);border-radius:16px;padding:3px;margin:4px 0 10px}
.pill button{flex:1;border:0;background:none;color:var(--tx);padding:8px 0;border-radius:14px;font-size:15px;font-family:inherit}
.pill button.on{background:var(--card);box-shadow:0 1px 4px #0002}
.range{text-align:center;color:var(--sub);margin:8px 0}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.chart{overflow:hidden}.chart svg{width:100%;height:auto}.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--tx)}.sw input{width:44px;height:36px;padding:0;border:0;background:none}.pill.t button{padding:10px 0}
.hd{display:flex;justify-content:space-between;align-items:center;padding:22px 16px 10px}.hd h1{margin:0;font-size:34px;font-weight:800}.hd .ic{font-size:26px}
.gridh{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.ic2{background:var(--card);border-radius:24px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.ic2 .r{display:flex;justify-content:space-between}
.ic2 .em{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:color-mix(in srgb,var(--ac) 20%,transparent)}
.ic2 .plus{width:44px;height:44px;border-radius:50%;border:0;background:var(--sf);color:var(--tx);font-size:28px}
.ic2 b{font-size:19px;display:block}.ic2 small{color:var(--sub);font-size:14px}
.emo{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.emo button{font-size:24px;width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--sf)}.emo button.on{border-color:var(--ac)}
.title{width:26%!important}
.tnode{position:absolute;border:2px solid;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;cursor:pointer;line-height:1.15;padding:0 3px;white-space:nowrap}
.tnode b{font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:100%}.tnode span{opacity:.85}
.troot{position:absolute;display:flex;align-items:center;justify-content:center;font-size:24px;width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid #8d6e4a}
.tplus{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--ac);color:#fff;font-size:15px;font-weight:700;line-height:17px;text-align:center;cursor:pointer;box-shadow:0 1px 3px #0004}
.nav2{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(94%,540px);display:flex;gap:2px;background:var(--card);border-radius:30px;box-shadow:0 4px 18px #0003;padding:5px;z-index:5}
.nav2 button{flex:1;border:0;background:none;color:var(--sub);font-size:11px;padding:6px 0;border-radius:24px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}.nav2 button span{font-size:20px}.nav2 button.on{background:var(--sf);color:var(--tx)}
.gcard{background:var(--card);border-radius:16px;padding:14px;margin:8px 0;cursor:pointer}
.chip{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;margin:6px 6px 0 0;background:var(--sf);color:var(--sub)}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 2px 8px;border-radius:14px;background:var(--card);cursor:pointer;min-height:98px}
.ach small{font-size:11px;line-height:1.2;margin-top:4px;max-height:27px;overflow:hidden}
.panel input[type=checkbox]{width:20px;height:20px;padding:0;vertical-align:middle;margin-right:6px}
.dcard{background:var(--card);border-radius:20px;padding:14px 16px;margin:10px 0}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dh b{font-size:17px}.dh span{color:var(--sub);font-size:13px;cursor:pointer}
.bar{background:var(--sf);border-radius:6px;height:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.drow{display:flex;align-items:center;gap:10px;margin:12px 0}.dic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;background:color-mix(in srgb,var(--ac) 20%,transparent);flex:none}
.dq{width:34px;height:34px;border-radius:50%;border:0;background:var(--sf);color:var(--tx);font-size:22px;flex:none}
.big2{font-size:28px;font-weight:700}.sm{color:var(--sub);font-size:12px}.cnt4{display:flex;justify-content:space-around;text-align:center}.cnt4 b{font-size:22px;display:block}
.nav2 button{font-size:10px}.nav2 button span{font-size:19px}
.tb{display:flex;flex-direction:column;align-items:center;margin:22px 0 30px}
.tn,.sk{border-radius:18px;text-align:center;padding:12px 16px;cursor:pointer;border:2px solid #8884;min-width:84px}
.tn{font-size:15px;padding:14px 22px}.tn .e{font-size:30px;display:block}.tn b{font-size:19px}
.tn small,.sk small{display:block;font-size:12px;opacity:.75}
.stem{width:3px;height:18px;border-radius:2px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding-top:0;width:100%}
.sk{position:relative;margin-top:18px}.sk::before{content:'';position:absolute;top:-20px;left:50%;margin-left:-1.5px;width:3px;height:20px;background:var(--lc,#8886);border-radius:2px}
.sk b{display:block;font-size:16px}.sk .st{letter-spacing:1px;font-size:13px}
.seg5{display:flex;gap:3px;justify-content:center;margin-top:5px}.seg5 i{width:12px;height:5px;border-radius:3px;background:#8886}.seg5 i.f{background:var(--ac)}
.full{animation:gl 2.4s ease-in-out infinite}@keyframes gl{50%{box-shadow:0 0 26px var(--ac)}}
.lit5{display:inline-block;margin-top:3px;font-size:12px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px}.chips button{border:0;border-radius:22px;padding:10px 18px;font-size:16px;background:var(--card);color:var(--tx);white-space:nowrap;font-family:inherit}.chips button.on{background:var(--tx);color:var(--bg)}
.gt{margin:16px 2px 6px;color:var(--sub);font-size:14px;font-weight:600}.panel select{width:100%;padding:11px;border-radius:10px;border:1px solid #8884;background:var(--sf);color:var(--tx);font-size:16px}
.ipv{width:72px;height:72px;border-radius:20px;background:color-mix(in srgb,var(--ac) 20%,transparent);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;margin:4px 0}.ipv img,.ic2 .em img{width:100%;height:100%;object-fit:cover}.ic2 .em{overflow:hidden}.panel{max-height:92vh;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0}
.big{font-size:30px;font-weight:700}.big span{font-size:14px;font-weight:400;margin-left:3px}
.lab{color:var(--sub);margin-top:4px}
.cmp{font-size:13px;margin-top:8px;line-height:1.7}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--sub)}
.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;margin:auto auto 0;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel label{display:block;color:var(--sub);margin:12px 0 4px;font-size:14px}
.panel input,.panel textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #8884;background:var(--sf);color:var(--tx);font-size:16px;font-family:inherit}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px}
.btn.g{background:var(--sf);color:var(--tx);margin-top:8px}
.empty{text-align:center;color:var(--sub);padding:30px}
body{padding-bottom:110px}</style></head><body>
<div id="dash"><div class="hd"><h1>DAKA</h1><span><button class="ic" id="dEdit" style="font-size:20px">✎</button><button class="ic" id="dGear">⚙</button></span></div><div class="pad" id="dbody"></div></div>
<div id="home" style="display:none"><div class="hd"><h1>DAKA</h1><span><button class="ic" id="gear">⚙</button><button class="ic" id="addItem">＋</button></span></div><div class="pad"><div class="chips" id="chips"></div><div id="items"></div></div></div>
<div id="tree" style="display:none"><div class="hd"><span style="display:flex;align-items:center"><button class="ic" id="tback">‹</button><h1 style="font-size:26px;margin-left:4px">我的技能树</h1></span><button class="ic" id="addRoot" style="font-size:18px">＋ 主系</button></div><div class="pad" id="tbody"></div></div>
<div id="life" style="display:none"><div class="hd"><h1 style="font-size:28px">人生进度</h1><span><button class="ic" id="lBirth" style="font-size:20px">🎂</button><button class="ic" id="lAdd" style="font-size:17px">＋ 事件</button></span></div><div class="pad" id="lbody"></div></div>
<div id="goals" style="display:none"><div class="hd"><h1 style="font-size:28px">人生目标</h1><button class="ic" id="gAdd" style="font-size:17px">＋ 目标</button></div><div class="pad" id="gbody"></div></div>
<div id="wall" style="display:none"><div class="hd"><h1 style="font-size:28px">成就墙</h1></div><div class="pad" id="wbody"></div></div>
<div class="nav2" id="nav2"><button data-v="dash" class="on"><span>📊</span>总览</button><button data-v="home"><span>🏠</span>打卡</button><button data-v="tree"><span>🌳</span>技能树</button><button data-v="life"><span>⏳</span>人生</button><button data-v="goals"><span>🎯</span>目标</button><button data-v="wall"><span>🏆</span>成就</button></div>
<div id="det" style="display:none">
<div class="top">
 <button class="ic" id="back">‹</button><input class="title" id="name" value="舞蹈课" maxlength="12">
 <div class="seg"><button id="t1" class="on">记录</button><button id="t2">统计</button></div>
 <button class="ic" id="more">⋯</button>
</div>

<div id="v1" class="pad">
 <div class="nav"><span id="mt"></span><span><b id="pm">‹</b><b id="nm">›</b></span></div>
 <div class="cal" id="cal"></div>
 <div class="list" id="list"></div>
</div>

<div id="v2" class="pad" style="display:none">
 <div class="pill" id="modes"></div>
 <div class="nav" style="margin:4px 0"><b id="pp">‹</b><span class="range" id="rg" style="margin:0;font-size:16px"></span><b id="np">›</b></div>
 <div class="card chart" id="chart"></div>
 <div class="grid" id="cards"></div>
</div>

<button class="fab" id="fab">+</button>
</div>

<div class="sheet" id="sh"><div class="panel" id="pn"></div></div>

<script>
const $=id=>document.getElementById(id);
const KEY='counter_v1';
let S={name:'舞蹈课',recs:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const NP=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Preferences;
const save=()=>{const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}try{NP()&&NP().set({key:KEY,value:j})}catch(e){}};
async function loadNative(){const p=NP();if(!p)return;try{const r=await p.get({key:KEY});if(r&&r.value){S=JSON.parse(r.value);migrate()}else if(S.recs.length)save()}catch(e){}}
const p2=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const WK=['周一','周二','周三','周四','周五','周六','周日'];
const wd=d=>(d.getDay()+6)%7;
function applyPrefs(){const r=document.documentElement;S.theme?r.setAttribute('data-theme',S.theme):r.removeAttribute('data-theme');r.style.setProperty('--ac',S.color||'#f2b000')}
applyPrefs();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
$('name').onchange=e=>{curItem().name=e.target.value||'打卡';save()};
let cur=null,view='dash',inDet=false;
const R=()=>S.recs.filter(r=>r.item==cur);
const curItem=()=>S.items.find(i=>i.id==cur);
function migrate(){if(!S.items){S.items=[{id:1,name:S.name||'舞蹈课',icon:'💃'}];S.recs.forEach(r=>r.item=1)}migrateTree();S.life=S.life||{birth:'',events:[]};S.life.events=S.life.events||[];S.lgoals=S.lgoals||[];S.lcats=S.lcats||['事业','家庭','健康','财富','成长','体验'];S.ach=S.ach||{};S.ltypes=S.ltypes||['一次性','累计','感受类','成就类']}
migrate();
const total=id=>S.recs.filter(r=>r.item==id).reduce((a,r)=>a+r.n,0);
const starsOf=it=>(it.goals||[]).filter(g=>total(it.id)>=g).length;
function starHtml(i){const g=i.goals||[];if(!g.length)return`<small data-g="${i.id}" style="display:block;color:var(--ac);margin:3px 0">＋ 设置星级目标</small>`;const t=total(i.id),k=starsOf(i),nx=g.find(x=>t<x);
 return`<div style="margin:3px 0;font-size:17px;letter-spacing:1px">${g.map((x,j)=>`<span style="color:${j<k?'var(--ac)':'#8886'}">★</span>`).join('')}</div><small style="display:block;margin-bottom:2px">累计 ${t}${nx?' / '+nx:' · 已满星'}</small>`}
function ago(ts){const d=new Date(ts),n=Math.round((sod(new Date())-sod(d))/864e5),t=p2(d.getHours())+':'+p2(d.getMinutes());return n<=0?'今天 '+t:n==1?'昨天 '+t:n+'天前'}
let backTo='home';
function go(){inDet=view=='det';['dash','home','tree','life','goals','wall'].forEach(v=>$(v).style.display=view==v?'':'none');$('det').style.display=inDet?'':'none';$('fab').style.display=inDet?'':'none';$('nav2').style.display=inDet?'none':'';document.querySelectorAll('#nav2 button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));if(inDet)sel();else render()}
function migrateTree(){
 if(S.tree)return;
 S.tree=[['body','💪','体魄'],['mind','🧠','认知'],['know','📚','学识'],['career','⚔️','事业'],['express','🗣️','表达'],['craft','🛠️','技艺']].map(([k,e,n])=>({id:'r_'+k,name:n,emoji:e,parent:null}));
 S.items.forEach(i=>{if(i.sys&&S.tree.some(n=>n.id=='r_'+i.sys)){let p='r_'+i.sys;
  [i.skill,i.sub].forEach(nm=>{if(!nm)return;let f=S.tree.find(n=>n.parent==p&&n.name==nm);if(!f){f={id:'n'+Date.now()+Math.random().toString(36).slice(2,6),name:nm,parent:p};S.tree.push(f)}p=f.id});
  i.node=p}})}
const kids=id=>S.tree.filter(n=>(n.parent||null)==id),roots=()=>kids(null),nodeById=id=>S.tree.find(n=>n.id==id);
function rootOf(id){let n=nodeById(id);while(n&&n.parent)n=nodeById(n.parent);return n}
function desc(id){const o=[id];kids(id).forEach(k=>o.push(...desc(k.id)));return o}
const itemsUnder=id=>{const d=desc(id);return S.items.filter(i=>d.includes(i.node))};
function prog(list){const g=list.filter(i=>(i.goals||[]).length);if(!g.length)return{pct:0,k:0,n:0,has:false};
 const pct=g.reduce((a,i)=>a+Math.min(1,total(i.id)/i.goals[i.goals.length-1]),0)/g.length;
 const ratio=g.reduce((a,i)=>a+starsOf(i)/i.goals.length,0)/g.length;
 return{pct:Math.floor(pct*100+1e-9),k:Math.min(5,Math.floor(ratio*5+1e-9)),n:g.length,has:true}}
function enterItem(id,from){cur=id;view='det';backTo=from;tab=1;mode='month';off=0;const t=new Date();cm=new Date(t.getFullYear(),t.getMonth(),1);$('name').value=curItem().name;close();go()}
const LV=[[0,.55],[14,.8],[26,.9],[40,1],[58,1],[80,1]];
function nodeStyle(k){const[p,o]=LV[k];return`background:color-mix(in srgb,var(--ac) ${p}%,var(--card));opacity:${o};color:${k>=4?'#222':'var(--tx)'};border-color:${k?'var(--ac)':'#8884'};${k>=3?`box-shadow:0 0 ${k*4}px var(--ac);`:''}`}
const starStr=k=>'★'.repeat(k)+'☆'.repeat(5-k);
function nodeForm(title,name0,emoji0,showEmoji,ok){
 const E=['💪','🧠','📚','⚔️','🗣️','🛠️','🎨','💰','❤️','🌿','🎵','🧘'];let em=emoji0||'';
 open(`<h3 style="margin:0">${title}</h3><label>名称</label><input id="nf_n" maxlength="12" value="${name0}" placeholder="例如：英语、口语">
 ${showEmoji?`<label>图标：点选，或点下面输入框用输入法的表情</label><div class="emo">${E.map(e=>`<button data-ne="${e}" class="${e==em?'on':''}">${e}</button>`).join('')}</div><input id="nf_e" value="${em}" placeholder="😀" style="margin-top:8px">`:''}
 <button class="btn" id="nf_ok">保存</button>`);
 document.querySelectorAll('[data-ne]').forEach(b=>b.onclick=()=>{em=b.dataset.ne;$('nf_e').value=em;document.querySelectorAll('[data-ne]').forEach(x=>x.classList.toggle('on',x==b))});
 if(showEmoji)$('nf_e').oninput=e=>{const x=firstEmoji(e.target.value);if(x)em=x};
 $('nf_ok').onclick=()=>{const n=$('nf_n').value.trim();if(!n){alert('请输入名称');return}ok(n,em)}}
function nodeSheet(id){
 const n=nodeById(id),its=itemsUnder(id),pr=prog(its),pc=pr.has?pr.pct:0;
 open(`<h3 style="margin:0">${n.emoji||''} ${n.name}</h3>
 <div style="margin:10px 0 6px;color:var(--sub)">进度 <b style="color:var(--tx);font-size:20px">${pr.has?pr.pct+'%':'未设目标'}</b> · 整体星级 <span style="color:var(--ac);font-size:18px">${starStr(pr.k)}</span></div>
 <div style="background:var(--sf);border-radius:6px;height:10px;overflow:hidden"><div style="height:100%;width:${pc}%;background:var(--ac)"></div></div>
 <label>这一枝上的目标（${its.length}）</label>

function renderTree(){
 migrate();
 const RW=60,CW=78,GP=26,RH=46,TOP=64,GAP=18,TX=26,BR='#8d6e4a';
 const colX=d=>d==0?30:30+RW+GP+(d-1)*(CW+GP),wd=d=>d?CW:RW;
 const rs=roots();
 if(!rs.length){$('tbody').innerHTML='<div class="empty">树上还没有主系 🌱<br><br>点右上角「＋ 主系」种下第一根主干。</div>';return}
 const rowsOf=n=>{const c=kids(n.id);return c.length?c.reduce((a,k)=>a+rowsOf(k),0):1};
 let N='',L='',maxD=0,firstY=null,y=TOP,nodesN=0,litN=0;
 const link=(x1,y1,x2,y2,k,wd)=>{const m=(x1+x2)/2;return`<path d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}" fill="none" stroke="${k?'var(--ac)':BR}" stroke-width="${wd}" stroke-linecap="round" opacity="${k?1:.65}"/>`};
 function draw(n,d,y0){
  const rows=rowsOf(n),cy=y0+rows*RH/2,pr=prog(itemsUnder(n.id)),k=pr.k,x=colX(d),w=wd(d),h=d?36:60;
  maxD=Math.max(maxD,d);nodesN++;if(k)litN++;
  const full=pr.has&&pr.pct>=100;
  const lab=!pr.has?'未设目标':(full?'✨ 100%':pr.pct+'% '+'★'.repeat(k));
  const inner=d?`<b style="font-size:13px">${n.name}</b><span style="font-size:10px">${lab}</span>`:`<span style="font-size:20px;opacity:1">${n.emoji||'🌿'}</span><b style="font-size:12px">${n.name}</b><span style="font-size:10px">${pr.has?pr.pct+'%':'未设目标'}</span>`;
  N+=`<div class="tnode ${full?'full':''}" data-nd="${n.id}" style="left:${x}px;top:${cy-h/2}px;width:${w}px;height:${h}px;${nodeStyle(k)}">${inner}</div><div class="tplus" data-add="${n.id}" style="left:${x+w-10}px;top:${cy+h/2-9}px">+</div>`;
  let cr=0;
  kids(n.id).forEach(c=>{const r=rowsOf(c),ccy=y0+(cr+r/2)*RH,ck=prog(itemsUnder(c.id)).k;L+=link(x+w,cy,colX(d+1),ccy,ck,d?3:4);draw(c,d+1,y0+cr*RH);cr+=r});
  return cy}
 rs.forEach(r=>{const rows=rowsOf(r),hb=Math.max(rows*RH,66),cy=draw(r,0,y+(hb-rows*RH)/2);if(firstY==null)firstY=cy;L+=link(TX,cy,30,cy,prog(itemsUnder(r.id)).k,6);y+=hb+GAP});
 const W=colX(maxD)+wd(maxD)+14,H=y+56,rootY=H-30;
 const trunk=`<path d="M${TX},${rootY} L${TX},${firstY-10}" stroke="${BR}" stroke-width="10" stroke-linecap="round" fill="none"/><text x="${TX}" y="${firstY-36}" font-size="30" text-anchor="middle">🌳</text>`;
 const all=S.items.filter(i=>i.node&&nodeById(i.node)),P=prog(all);
 $('tbody').innerHTML=`<div class="card" style="margin:6px 0 10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><div><span style="font-size:30px;font-weight:700">${P.has?P.pct+'%':'--'}</span><span style="color:var(--sub);margin-left:6px">整体进度</span></div><div style="font-size:20px;color:var(--ac)">${starStr(P.k)}</div></div><div style="background:var(--sf);border-radius:6px;height:8px;overflow:hidden;margin-top:8px"><div style="height:100%;width:${P.pct}%;background:var(--ac)"></div></div><div style="color:var(--sub);font-size:13px;margin-top:6px">${rs.length} 个主系 · ${nodesN} 个节点 · 已点亮 ${litN} · ${all.length} 个目标${P.has?'':'（给目标设置星级目标后显示进度）'}</div></div><div style="overflow-x:auto"><div id="tw" style="position:relative;width:${W}px;height:${H}px;margin:0 auto"><svg width="${W}" height="${H}" style="position:absolute;left:0;top:0">${trunk}${L}</svg>${N}<div class="troot" style="left:${TX-22}px;top:${rootY-12}px">🌱</div></div></div>`;
 const z=Math.min(1.4,Math.max(.6,(Math.min(window.innerWidth,560)-32)/W));$('tw').style.zoom=z;
 const at=(x,f)=>document.querySelectorAll('['+x+']').forEach(el=>el.onclick=()=>f(el.getAttribute(x)));
 at('data-nd',nodeSheet);
 at('data-add',id=>{const n=nodeById(id);nodeForm('在「'+n.name+'」下添加分支','','',false,nm=>{S.tree.push({id:'n'+Date.now(),name:nm,parent:id});save();close();renderTree()})})}

function cardHtml(i){const last=Math.max(0,...S.recs.filter(r=>r.item==i.id).map(r=>r.ts));
 return`<div class="ic2" data-i="${i.id}"><div class="r"><span class="em">${isImg(i.icon)?`<img src="${i.icon}">`:i.icon}</span><button class="plus" data-p="${i.id}">+</button></div><div><b>${i.name}</b>${starHtml(i)}<small>上次：${last?ago(last):'暂无'}</small></div></div>`}
const SORTS={new:['创建：先 → 后',(a,b)=>a.i.id-b.i.id],newD:['创建：后 → 先',(a,b)=>b.i.id-a.i.id],last:['最近打卡优先',(a,b)=>b.last-a.last],lastO:['最久未打卡优先',(a,b)=>a.last-b.last],name:['名称 A → Z',(a,b)=>a.i.name.localeCompare(b.i.name,'zh')],totD:['累计数量：多 → 少',(a,b)=>b.t-a.t],totA:['累计数量：少 → 多',(a,b)=>a.t-b.t],starD:['星级：高 → 低',(a,b)=>b.k-a.k||b.t-a.t],starA:['星级：低 → 高',(a,b)=>a.k-b.k||a.t-b.t]};
const GROUPS={none:'不分组',root:'按主系',star:'按完成星级',lit:'按是否点亮'};
function renderHome(){
 migrate();
 const rid=i=>{const r=i.node&&rootOf(i.node);return r?r.id:''};
 const rts=roots().filter(r=>S.items.some(i=>rid(i)==r.id)),hasNone=S.items.some(i=>!rid(i));
 let fc=S.fcat||'ALL';if(fc!='ALL'&&fc!='__none'&&!rts.some(r=>r.id==fc))fc='ALL';
 const chips=rts.length?[['ALL','所有'],...rts.map(r=>[r.id,(r.emoji||'')+r.name]),...(hasNone?[['__none','未加入技能树']]:[])]:[];
 $('chips').innerHTML=chips.map(([v,t])=>`<button data-f="${v}" class="${v==fc?'on':''}">${t}</button>`).join('');
 document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{S.fcat=b.dataset.f;save();renderHome()});
 let L=S.items.filter(i=>fc=='ALL'||(fc=='__none'?!rid(i):rid(i)==fc)).map(i=>({i,t:total(i.id),k:starsOf(i),last:Math.max(0,...S.recs.filter(r=>r.item==i.id).map(r=>r.ts))}));
 L.sort((SORTS[S.sort]||SORTS.new)[1]);
 const gm=S.group=='cat'?'root':(S.group||'none');let groups=[];
 if(gm=='none')groups=[['',L]];
 else if(gm=='root'){roots().forEach(r=>groups.push([(r.emoji||'')+r.name,L.filter(x=>rid(x.i)==r.id)]));groups.push(['未加入技能树',L.filter(x=>!rid(x.i))])}
 else if(gm=='star'){for(let k=5;k>=0;k--)groups.push([k?'★ '+k+' 星':'0 星 / 未设目标',L.filter(x=>x.k==k)])}
 else groups=[['已点亮（≥1 星）',L.filter(x=>x.k>=1)],['未点亮',L.filter(x=>x.k<1)]];
 groups=groups.filter(g=>g[1].length);
 $('items').innerHTML=groups.map(([t,l])=>(t?`<div class="gt">${t} · ${l.length}</div>`:'')+`<div class="gridh">${l.map(x=>cardHtml(x.i)).join('')}</div>`).join('')||'<div class="empty">点右上角 ＋ 新建一个打卡项目</div>';
 document.querySelectorAll('.ic2').forEach(el=>el.onclick=e=>{
  if(e.target.dataset.g){editItem(+e.target.dataset.g);return}
  if(e.target.dataset.p){cur=+e.target.dataset.p;openEdit(0);return}
  enterItem(+el.dataset.i,'home')})}

 $('mt').textContent=y+'年'+(m+1)+'月';
 const days=new Set(R().map(r=>dk(new Date(r.ts))));
 const td=dk(new Date());
 const imgs={};if(S.dayImg)R().sort((a,b)=>a.ts-b.ts).forEach(r=>{if(r.img)imgs[dk(new Date(r.ts))]=r.img});

 for(let i=0;i<42;i++){const d=addD(st,i);if(i>=35&&d.getMonth()!=m)break;

function range(md,o){
 const t=sod(new Date());
 if(md=='week'){const s=addD(addD(t,-wd(t)),o*7);return[s,addD(s,7)]}
 if(md=='month'){return[new Date(t.getFullYear(),t.getMonth()+o,1),new Date(t.getFullYear(),t.getMonth()+o+1,1)]}
 if(md=='quarter'){const q=Math.floor(t.getMonth()/3)*3+o*3;return[new Date(t.getFullYear(),q,1),new Date(t.getFullYear(),q+3,1)]}
 if(md=='year'){return[new Date(t.getFullYear()+o,0,1),new Date(t.getFullYear()+o+1,0,1)]}
 const f=R().length?sod(new Date(Math.min(...R().map(r=>r.ts)))):t;return[f,addD(t,1)]
}
function shiftYear(d,n){return new Date(d.getFullYear()+n,d.getMonth(),d.getDate())}
function sameRange(md,o){const[s,e]=range(md,o);
 if(md=='week')return[addD(s,-364),addD(e,-364)];
 return[shiftYear(s,-1),shiftYear(e,-1)]}
function calc([s,e]){
 const rs=R().filter(r=>r.ts>=s&&r.ts<e);
 const count=rs.reduce((a,r)=>a+r.n,0);
 const ds=[...new Set(rs.map(r=>dk(new Date(r.ts))))].sort();
 const today=addD(sod(new Date()),1);
 const end=e>today?today:e;
 const span=Math.max(1,Math.round((end-s)/864e5));
 let gap=null;
 if(ds.length>1){gap=(new Date(ds[ds.length-1])-new Date(ds[0]))/864e5/(ds.length-1)}
 return{count,days:ds.length,avg:count/span,gap,rs}}
function delta(c,p,d=0){
 if(p==null)return'<span class="fl">—</span>';
 if(p==0)return c==0?'<span class="fl">持平</span>':'<span class="up">▲ 新增</span>';
 const v=(c-p)/p*100;
 if(Math.abs(v)<0.05)return'<span class="fl">持平</span>';
 return v>0?`<span class="up">▲ ${v.toFixed(1)}%</span>`:`<span class="dn">▼ ${Math.abs(v).toFixed(1)}%</span>`}
const lblPrev={week:'上周',month:'上月',quarter:'上季',year:'去年',all:''};
const lblSame={week:'去年同周',month:'去年同月',quarter:'去年同季',year:'前年',all:''};
function rangeLabel(md,[s,e]){
 const f=d=>d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate());
 const l=addD(e,-1);
 if(md=='month')return s.getFullYear()+'年'+(s.getMonth()+1)+'月';
 if(md=='quarter')return s.getFullYear()+'年第'+(s.getMonth()/3+1)+'季度';
 if(md=='year')return s.getFullYear()+'年';
 return f(s)+' – '+f(l)}

function buckets(md,[s,e]){
 const out=[];let hi=-1;const sum=(x,y)=>R().filter(r=>r.ts>=x&&r.ts<y).reduce((a,r)=>a+r.n,0);
 if(md=='week'||md=='month'){for(let d=new Date(s);d<e;d=addD(d,1))out.push({l:md=='week'?WK[wd(d)].slice(1):String(d.getDate()),s:d,e:addD(d,1)})}
 else if(md=='quarter'){const y=s.getFullYear();for(let q=0;q<4;q++)out.push({l:'Q'+(q+1),s:new Date(y,q*3,1),e:new Date(y,q*3+3,1)});hi=s.getMonth()/3}
 else{let d=new Date(s.getFullYear(),s.getMonth(),1);while(d<e){const n=new Date(d.getFullYear(),d.getMonth()+1,1);out.push({l:md=='all'?String(d.getFullYear()).slice(2)+'.'+p2(d.getMonth()+1):(d.getMonth()+1)+'月',s:d,e:n});d=n}}
 out.forEach(b=>b.v=sum(b.s,b.e));
 return{bs:out,hi}}
function chartSvg({bs,hi}){
 const W=340,H=170,pad=22,mx=Math.max(1,...bs.map(b=>b.v)),bw=W/bs.length;
 const step=Math.ceil(bs.length/(bs.length>16?8:12));
 const g=bs.map((b,i)=>{const h=b.v/mx*(H-pad-20),x=i*bw+bw*0.18,y=H-pad-h,w=bw*0.64,cx=x+w/2;
  const op=hi<0||hi==i?1:0.35;
  return`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,b.v?2:0)}" rx="${Math.min(3,w/2)}" style="fill:var(--ac)" opacity="${op}"/>
  ${b.v&&bs.length<=31?`<text x="${cx}" y="${y-4}" font-size="11" text-anchor="middle" fill="currentColor">${b.v}</text>`:''}
  ${i%step==0?`<text x="${cx}" y="${H-6}" font-size="10" text-anchor="middle" fill="#999">${b.l}</text>`:''}`}).join('');
 return`<svg viewBox="0 0 ${W} ${H}">${g}<line x1="0" x2="${W}" y1="${H-pad}" y2="${H-pad}" stroke="#8884"/></svg>`}

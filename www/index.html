<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAKA</title>
<style>
:root{--bg:#f7f7f7;--card:#fff;--tx:#222;--sub:#999;--ac:#f2b000;--sf:#f2f2f2;--up:#e5484d;--dn:#30a46c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1c1e;--tx:#eee;--sub:#888;--sf:#2a2a2c}}
:root[data-theme="dark"]{--bg:#111;--card:#1c1c1e;--tx:#eee;--sub:#888;--sf:#2a2a2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,"PingFang SC","Helvetica Neue",sans-serif;max-width:560px;margin:0 auto;padding-bottom:90px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.title{font-size:18px;font-weight:600;border:0;background:none;color:var(--tx);width:34%;font-family:inherit}
.seg{display:flex;border:1px solid var(--ac);border-radius:20px;padding:2px}
.seg button{border:0;background:none;color:var(--sub);padding:7px 20px;border-radius:18px;font-size:16px;font-family:inherit}
.seg button.on{background:var(--ac);color:#fff}
.ic{border:0;background:none;color:var(--tx);font-size:22px;padding:4px 8px}
.pad{padding:0 16px}
.nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;font-size:20px;font-weight:600}
.nav b{font-size:24px;padding:0 10px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:8px}
.cal .h{color:var(--sub);font-size:13px;padding-bottom:4px}
.d{height:38px;width:38px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.d.o{color:#bbb}.d.has{background:var(--ac);color:#fff}.d.today{background:#333;color:#fff}
.list{background:var(--card);border-radius:22px 22px 0 0;margin-top:16px;padding:10px 16px}
.day{margin:14px 0 6px;font-size:18px;font-weight:600}
.item{display:flex;justify-content:space-between;background:var(--sf);border-radius:12px;padding:14px;margin:6px 0}
.item small{color:var(--ac);margin-right:10px}
.item i{color:var(--sub);font-style:normal;font-size:13px}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:34px;box-shadow:0 4px 14px #0004}
.pill{display:flex;background:var(--sf);border-radius:16px;padding:3px;margin:4px 0 10px}
.pill button{flex:1;border:0;background:none;color:var(--tx);padding:8px 0;border-radius:14px;font-size:15px;font-family:inherit}
.pill button.on{background:var(--card);box-shadow:0 1px 4px #0002}
.range{text-align:center;color:var(--sub);margin:8px 0}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.chart{overflow:hidden}.chart svg{width:100%;height:auto}.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--tx)}.sw input{width:44px;height:36px;padding:0;border:0;background:none}.pill.t button{padding:10px 0}
.hd{display:flex;justify-content:space-between;align-items:center;padding:22px 16px 10px}.hd h1{margin:0;font-size:34px;font-weight:800}.hd .ic{font-size:26px}
.gridh{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.ic2{background:var(--card);border-radius:24px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.ic2 .r{display:flex;justify-content:space-between}
.ic2 .em{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:color-mix(in srgb,var(--ac) 20%,transparent)}
.ic2 .plus{width:44px;height:44px;border-radius:50%;border:0;background:var(--sf);color:var(--tx);font-size:28px}
.ic2 b{font-size:19px;display:block}.ic2 small{color:var(--sub);font-size:14px}
.emo{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.emo button{font-size:24px;width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--sf)}.emo button.on{border-color:var(--ac)}
.title{width:26%!important}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px}.chips button{border:0;border-radius:22px;padding:10px 18px;font-size:16px;background:var(--card);color:var(--tx);white-space:nowrap;font-family:inherit}.chips button.on{background:var(--tx);color:var(--bg)}
.gt{margin:16px 2px 6px;color:var(--sub);font-size:14px;font-weight:600}.panel select{width:100%;padding:11px;border-radius:10px;border:1px solid #8884;background:var(--sf);color:var(--tx);font-size:16px}
.ipv{width:72px;height:72px;border-radius:20px;background:color-mix(in srgb,var(--ac) 20%,transparent);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;margin:4px 0}.ipv img,.ic2 .em img{width:100%;height:100%;object-fit:cover}.ic2 .em{overflow:hidden}.panel{max-height:92vh;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0}
.big{font-size:30px;font-weight:700}.big span{font-size:14px;font-weight:400;margin-left:3px}
.lab{color:var(--sub);margin-top:4px}
.cmp{font-size:13px;margin-top:8px;line-height:1.7}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--sub)}
.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;margin:auto auto 0;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel label{display:block;color:var(--sub);margin:12px 0 4px;font-size:14px}
.panel input,.panel textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #8884;background:var(--sf);color:var(--tx);font-size:16px;font-family:inherit}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px}
.btn.g{background:var(--sf);color:var(--tx);margin-top:8px}
.empty{text-align:center;color:var(--sub);padding:30px}
</style></head><body>
<div id="home"><div class="hd"><h1>DAKA</h1><span><button class="ic" id="gear">⚙</button><button class="ic" id="addItem">＋</button></span></div><div class="pad"><div class="chips" id="chips"></div><div id="items"></div></div></div>
<div id="det" style="display:none">
<div class="top">
 <button class="ic" id="back">‹</button><input class="title" id="name" value="舞蹈课" maxlength="12">
 <div class="seg"><button id="t1" class="on">记录</button><button id="t2">统计</button></div>
 <button class="ic" id="more">⋯</button>
</div>

<div id="v1" class="pad">
 <div class="nav"><span id="mt"></span><span><b id="pm">‹</b><b id="nm">›</b></span></div>
 <div class="cal" id="cal"></div>
 <div class="list" id="list"></div>
</div>

<div id="v2" class="pad" style="display:none">
 <div class="pill" id="modes"></div>
 <div class="nav" style="margin:4px 0"><b id="pp">‹</b><span class="range" id="rg" style="margin:0;font-size:16px"></span><b id="np">›</b></div>
 <div class="card chart" id="chart"></div>
 <div class="grid" id="cards"></div>
</div>

<button class="fab" id="fab">+</button>
</div>

<div class="sheet" id="sh"><div class="panel" id="pn"></div></div>

<script>
const $=id=>document.getElementById(id);
const KEY='counter_v1';
let S={name:'舞蹈课',recs:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const NP=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Preferences;
const save=()=>{const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}try{NP()&&NP().set({key:KEY,value:j})}catch(e){}};
async function loadNative(){const p=NP();if(!p)return;try{const r=await p.get({key:KEY});if(r&&r.value){S=JSON.parse(r.value);migrate()}else if(S.recs.length)save()}catch(e){}}
const p2=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const WK=['周一','周二','周三','周四','周五','周六','周日'];
const wd=d=>(d.getDay()+6)%7;
function applyPrefs(){const r=document.documentElement;S.theme?r.setAttribute('data-theme',S.theme):r.removeAttribute('data-theme');r.style.setProperty('--ac',S.color||'#f2b000')}
applyPrefs();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
$('name').onchange=e=>{curItem().name=e.target.value||'打卡';save()};
let cur=null,view='home',inDet=false;
const R=()=>S.recs.filter(r=>r.item==cur);
const curItem=()=>S.items.find(i=>i.id==cur);
function migrate(){if(!S.cats)S.cats=['技能类','体验类','财富类'];if(!S.items){S.items=[{id:1,name:S.name||'舞蹈课',icon:'💃'}];S.recs.forEach(r=>r.item=1)}}
migrate();
const total=id=>S.recs.filter(r=>r.item==id).reduce((a,r)=>a+r.n,0);
const starsOf=it=>(it.goals||[]).filter(g=>total(it.id)>=g).length;
function starHtml(i){const g=i.goals||[];if(!g.length)return`<small data-g="${i.id}" style="display:block;color:var(--ac);margin:3px 0">＋ 设置星级目标</small>`;const t=total(i.id),k=starsOf(i),nx=g.find(x=>t<x);
 return`<div style="margin:3px 0;font-size:17px;letter-spacing:1px">${g.map((x,j)=>`<span style="color:${j<k?'var(--ac)':'#8886'}">★</span>`).join('')}</div><small style="display:block;margin-bottom:2px">累计 ${t}${nx?' / '+nx:' · 已满星'}</small>`}
function ago(ts){const d=new Date(ts),n=Math.round((sod(new Date())-sod(d))/864e5),t=p2(d.getHours())+':'+p2(d.getMinutes());return n<=0?'今天 '+t:n==1?'昨天 '+t:n+'天前'}
function go(){inDet=view=='det';$('home').style.display=inDet?'none':'';$('det').style.display=inDet?'':'none';$('fab').style.display=inDet?'':'none';if(inDet)sel();else renderHome()}
function cardHtml(i){const last=Math.max(0,...S.recs.filter(r=>r.item==i.id).map(r=>r.ts));
 return`<div class="ic2" data-i="${i.id}"><div class="r"><span class="em">${isImg(i.icon)?`<img src="${i.icon}">`:i.icon}</span><button class="plus" data-p="${i.id}">+</button></div><div><b>${i.name}</b>${starHtml(i)}<small>上次：${last?ago(last):'暂无'}</small></div></div>`}
const SORTS={new:['创建：先 → 后',(a,b)=>a.i.id-b.i.id],newD:['创建：后 → 先',(a,b)=>b.i.id-a.i.id],last:['最近打卡优先',(a,b)=>b.last-a.last],lastO:['最久未打卡优先',(a,b)=>a.last-b.last],name:['名称 A → Z',(a,b)=>a.i.name.localeCompare(b.i.name,'zh')],totD:['累计数量：多 → 少',(a,b)=>b.t-a.t],totA:['累计数量：少 → 多',(a,b)=>a.t-b.t],starD:['星级：高 → 低',(a,b)=>b.k-a.k||b.t-a.t],starA:['星级：低 → 高',(a,b)=>a.k-b.k||a.t-b.t]};
const GROUPS={none:'不分组',cat:'按分类',star:'按完成星级',lit:'按是否点亮'};
function renderHome(){
 migrate();
 const catsUsed=S.cats.filter(c=>S.items.some(i=>i.cat==c)),hasNone=S.items.some(i=>!i.cat);
 let fc=S.fcat||'ALL';if(fc!='ALL'&&fc!='__none'&&!catsUsed.includes(fc))fc='ALL';
 const chips=catsUsed.length?[['ALL','所有'],...catsUsed.map(c=>[c,c]),...(hasNone?[['__none','未分类']]:[])]:[];
 $('chips').innerHTML=chips.map(([v,t])=>`<button data-f="${v}" class="${v==fc?'on':''}">${t}</button>`).join('');
 document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{S.fcat=b.dataset.f;save();renderHome()});
 let L=S.items.filter(i=>fc=='ALL'||(fc=='__none'?!i.cat:i.cat==fc)).map(i=>({i,t:total(i.id),k:starsOf(i),last:Math.max(0,...S.recs.filter(r=>r.item==i.id).map(r=>r.ts))}));
 L.sort((SORTS[S.sort]||SORTS.new)[1]);
 const gm=S.group||'none';let groups=[];
 if(gm=='none')groups=[['',L]];
 else if(gm=='cat'){[...S.cats,''].forEach(c=>groups.push([c||'未分类',L.filter(x=>(x.i.cat||'')==c)]))}
 else if(gm=='star'){for(let k=5;k>=0;k--)groups.push([k?'★ '+k+' 星':'0 星 / 未设目标',L.filter(x=>x.k==k)])}
 else groups=[['已点亮（≥1 星）',L.filter(x=>x.k>=1)],['未点亮',L.filter(x=>x.k<1)]];
 groups=groups.filter(g=>g[1].length);
 $('items').innerHTML=groups.map(([t,l])=>(t?`<div class="gt">${t} · ${l.length}</div>`:'')+`<div class="gridh">${l.map(x=>cardHtml(x.i)).join('')}</div>`).join('')||'<div class="empty">点右上角 ＋ 新建一个打卡项目</div>';
 document.querySelectorAll('.ic2').forEach(el=>el.onclick=e=>{
  if(e.target.dataset.g){editItem(+e.target.dataset.g);return}
  if(e.target.dataset.p){cur=+e.target.dataset.p;openEdit(0);return}
  cur=+el.dataset.i;view='det';tab=1;mode='month';off=0;const t=new Date();cm=new Date(t.getFullYear(),t.getMonth(),1);$('name').value=curItem().name;go()})}
$('back').onclick=()=>{view='home';go()};
const isImg=x=>typeof x=='string'&&x.startsWith('data:');
function firstEmoji(v){v=v.trim();if(!v)return'';try{return[...new Intl.Segmenter().segment(v)][0].segment}catch(e){return Array.from(v)[0]}}
function iconSheet(title,name0,icon0,okTxt,done,goals0,cat0){
 migrate();let cat=cat0||'';
 const em=['💃','📚','🏃','🧘','🎵','🏋️','🍎','💧','🛌','✍️','🎨','🌳'];let pick=icon0||em[0];
 const prev=()=>{$('ipv').innerHTML=isImg(pick)?`<img src="${pick}">`:pick};
 open(`<h3 style="margin:0">${title}</h3><label>名称</label><input id="in_n" maxlength="12" value="${name0}" placeholder="例如：英语跟读打卡">
 <label>分类</label><div class="emo" id="cats">${['',...S.cats].map(c=>`<button data-ct="${c}" style="font-size:15px;width:auto;padding:0 14px" class="${c==cat?'on':''}">${c||'未分类'}</button>`).join('')}</div><input id="in_cat" placeholder="或输入新分类，例如：健康类" style="margin-top:8px">
 <label>星级目标：累计数量，空格隔开，最多5个（可不填）</label><input id="in_g" value="${(goals0||[]).join(' ')}" placeholder="例如 200 500 1000 1500 2000">
 <label>图标</label><div class="ipv" id="ipv"></div>
 <div class="emo">${em.map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div>
 <label>想用输入法里的表情：点下面输入框，切到键盘的表情页选一个</label><input id="in_e" placeholder="😀">
 <button class="btn g" id="up">从相册上传图片</button><input type="file" id="fl" accept="image/*" style="display:none">
 <button class="btn" id="ok">${okTxt}</button>`);
 prev();
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{pick=b.dataset.e;prev()});
 $('in_e').oninput=e=>{const x=firstEmoji(e.target.value);if(x){pick=x;prev()}};
 document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{cat=b.dataset.ct;$('in_cat').value='';document.querySelectorAll('[data-ct]').forEach(x=>x.classList.toggle('on',x==b))});
 $('up').onclick=()=>$('fl').click();
 $('fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const N=128,c=document.createElement('canvas');c.width=c.height=N;const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,N,N);pick=c.toDataURL('image/png');prev()};im.src=rd.result};rd.readAsDataURL(f)};
 $('ok').onclick=()=>{const n=$('in_n').value.trim();if(!n){alert('请输入名称');return}const g=[...new Set($('in_g').value.split(/[\s,，、]+/).map(Number).filter(x=>x>0))].sort((a,b)=>a-b).slice(0,5);const nc=$('in_cat').value.trim();if(nc){cat=nc;if(!S.cats.includes(nc))S.cats.push(nc)}done(n,pick,g,cat)};
}
$('addItem').onclick=()=>iconSheet('新建打卡项目','','','创建',(n,ic,g,c)=>{S.items.push({id:Date.now(),name:n,icon:ic,goals:g,cat:c});save();close();renderHome()},undefined,(S.fcat&&S.fcat!='ALL'&&S.fcat!='__none')?S.fcat:'');

let tab=1,cm=new Date(),mode='month',off=0;
cm=new Date(cm.getFullYear(),cm.getMonth(),1);

function sel(){document.querySelectorAll('.top .seg button').forEach(b=>b.classList.remove('on'));$('t'+tab).classList.add('on');$('v1').style.display=tab==1?'':'none';$('v2').style.display=tab==2?'':'none';render()}
$('t1').onclick=()=>{tab=1;sel()};$('t2').onclick=()=>{tab=2;sel()};

// ---------- records ----------
function renderRec(){
 const y=cm.getFullYear(),m=cm.getMonth();
 $('mt').textContent=y+'年'+(m+1)+'月';
 const days=new Set(R().map(r=>dk(new Date(r.ts))));
 const td=dk(new Date());
 const imgs={};if(S.dayImg)R().sort((a,b)=>a.ts-b.ts).forEach(r=>{if(r.img)imgs[dk(new Date(r.ts))]=r.img});
 let h=WK.map(w=>`<div class="h">${w.slice(1)}</div>`).join('');
 let st=addD(cm,-wd(cm));
 for(let i=0;i<42;i++){const d=addD(st,i);if(i>=35&&d.getMonth()!=m)break;
  const o=d.getMonth()!=m,k=dk(d);
  h+=`<div class="d ${o?'o':''} ${days.has(k)&&!o?'has':''} ${k==td?'today':''}" data-k="${k}"${imgs[k]&&!o?` style="background:url('${imgs[k]}') center/cover;color:#fff;text-shadow:0 0 4px #000"`:''}>${k==td?'今':d.getDate()}</div>`}
 $('cal').innerHTML=h;
 document.querySelectorAll('#cal .d').forEach(el=>el.onclick=()=>{const[y,m,d]=el.dataset.k.split('-').map(Number),n=new Date();openEdit(0,new Date(y,m-1,d,n.getHours(),n.getMinutes()).getTime())});
 const rs=[...R()].sort((a,b)=>b.ts-a.ts);
 if(!rs.length){$('list').innerHTML='<div class="empty">还没有记录，点右下角 + 添加</div>';return}
 let out='',last='';
 rs.slice(0,200).forEach(r=>{const d=new Date(r.ts),k=dk(d);
  if(k!=last){out+=`<div class="day">${d.getFullYear()}年${p2(d.getMonth()+1)}月${p2(d.getDate())}日 <small style="color:var(--sub);font-size:13px">${WK[wd(d)]}</small></div>`;last=k}
  out+=`<div class="item" data-id="${r.id}"><span><small>${p2(d.getHours())}:${p2(d.getMinutes())}</small>${curItem().name} ${r.n}</span><i style="display:flex;align-items:center">${r.note||''}${r.img?`<img src="${r.img}" style="width:34px;height:34px;border-radius:8px;object-fit:cover;margin-left:8px">`:''}</i></div>`});
 $('list').innerHTML=out;
 document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openEdit(+el.dataset.id));
}
$('pm').onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);render()};
$('nm').onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);render()};

// ---------- sheet ----------
const open=h=>{$('pn').innerHTML=h;$('sh').classList.add('show')};
const close=()=>$('sh').classList.remove('show');
$('sh').onclick=e=>{if(e.target==$('sh'))close()};
const nowStr=d=>dk(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes());
function catSheet(){
 migrate();
 open(`<h3 style="margin:0">分类管理</h3><label>点输入框直接改名，改完点空白处保存；✕ 删除（该分类下的项目会变成“未分类”）</label>
 ${S.cats.map((c,i)=>`<div style="display:flex;gap:8px;margin:6px 0"><input data-ci="${i}" value="${c}" maxlength="10"><button class="btn g" data-cd="${i}" style="width:56px;margin:0">✕</button></div>`).join('')||'<div class="empty">还没有分类</div>'}
 <label>新增分类</label><div style="display:flex;gap:8px"><input id="nc" maxlength="10" placeholder="例如：健康类"><button class="btn" id="ncb" style="width:80px;margin:0">添加</button></div>
 <button class="btn g" id="cback">返回设置</button>`);
 document.querySelectorAll('[data-ci]').forEach(el=>el.onchange=()=>{
  const i=+el.dataset.ci,old=S.cats[i],nv=el.value.trim();
  if(!nv){el.value=old;return}
  if(nv==old)return;
  S.items.forEach(x=>{if(x.cat==old)x.cat=nv});
  if(S.fcat==old)S.fcat=nv;
  if(S.cats.includes(nv)){S.cats.splice(i,1)}else S.cats[i]=nv;
  save();catSheet()});
 document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.cd,c=S.cats[i],n=S.items.filter(x=>x.cat==c).length;
  if(!confirm('删除分类“'+c+'”？'+(n?'其下 '+n+' 个项目会变成未分类。':'')))return;
  S.items.forEach(x=>{if(x.cat==c)x.cat=''});if(S.fcat==c)S.fcat='ALL';
  S.cats.splice(i,1);save();catSheet()});
 $('ncb').onclick=()=>{const v=$('nc').value.trim();if(!v)return;if(S.cats.includes(v)){alert('分类已存在');return}S.cats.push(v);save();catSheet()};
 $('cback').onclick=()=>{$('more').onclick();if(view=='home')renderHome();else render()};
}
function compress(f,max,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.7))};im.src=rd.result};rd.readAsDataURL(f)}
function editItem(id){cur=id;const it=curItem();iconSheet('修改项目',it.name,it.icon,'保存',(n,ic,g,c)=>{it.name=n;it.icon=ic;it.goals=g;it.cat=c;save();if(view=='det')$('name').value=n;close();render()},it.goals,it.cat)}
function openEdit(id,ts0){
 const r=id?S.recs.find(x=>x.id==id):{n:1,note:'',ts:ts0||Date.now()};let img=r.img||'';
 open(`<h3 style="margin:0">${id?'编辑记录':'新增记录'}</h3>
 <label>时间</label><input type="datetime-local" id="f_t" value="${nowStr(new Date(r.ts))}">
 <label>数量（节/次）</label><input type="number" id="f_n" min="1" value="${r.n}">
 <label>备注</label><input id="f_c" value="${r.note||''}">
 <label>图片（可选）</label><div class="ipv" id="pv" style="width:96px;height:96px;font-size:13px;color:var(--sub)"></div><input type="file" id="f_i" accept="image/*" style="display:none">
 <div style="display:flex;gap:8px"><button class="btn g" id="addImg" style="margin-top:6px">选择图片</button><button class="btn g" id="rmImg" style="margin-top:6px">移除图片</button></div>
 <button class="btn" id="ok">保存</button>${id?'<button class="btn g" id="del">删除</button>':''}`);
 const pv=()=>{$('pv').innerHTML=img?`<img src="${img}">`:'无图片'};pv();
 $('addImg').onclick=()=>$('f_i').click();$('rmImg').onclick=()=>{img='';pv()};
 $('f_i').onchange=e=>{const f=e.target.files[0];if(f)compress(f,480,d=>{img=d;pv()})};
 $('ok').onclick=()=>{const ts=new Date($('f_t').value).getTime()||Date.now(),n=Math.max(1,+$('f_n').value||1),note=$('f_c').value;
  if(id){Object.assign(r,{ts,n,note,img})}else{const it=curItem(),b=it?starsOf(it):0;S.recs.push({id:Date.now(),item:cur,ts,n,note,img});const a=it?starsOf(it):0;if(a>b)setTimeout(()=>alert('🎉 恭喜！「'+it.name+'」获得第 '+a+' 颗星 ⭐'),100)}
  save();close();render()};
 if(id)$('del').onclick=()=>{if(confirm('确定删除？')){S.recs=S.recs.filter(x=>x.id!=id);save();close();render()}};
}
$('fab').onclick=()=>openEdit(0);
$('more').onclick=()=>{
 const cols=['#f2b000','#ff7a45','#e5484d','#e255a1','#8e4ec6','#3e63dd','#0090ff','#30a46c'];
 const th=[['','跟随系统'],['light','白天'],['dark','夜间']];
 open(`<h3 style="margin:0">设置</h3>
 <label>显示模式</label><div class="pill t">${th.map(([v,t])=>`<button data-th="${v}" class="${(S.theme||'')==v?'on':''}">${t}</button>`).join('')}</div>
 <button class="btn g" id="catm" style="margin-top:12px">分类管理（改名 / 删除 / 新增）</button>
 <label>主页分组方式</label><select id="s_g">${Object.entries(GROUPS).map(([v,t])=>`<option value="${v}" ${(S.group||'none')==v?'selected':''}>${t}</option>`).join('')}</select>
 <label>主页排序</label><select id="s_s">${Object.entries(SORTS).map(([v,x])=>`<option value="${v}" ${(S.sort||'new')==v?'selected':''}>${x[0]}</option>`).join('')}</select>
 <label>点亮的日期显示</label><div class="pill t"><button data-di="0" class="${S.dayImg?'':'on'}">系统颜色</button><button data-di="1" class="${S.dayImg?'on':''}">备注图片</button></div>
 <label>主题色</label><div class="sw">${cols.map(c=>`<button data-c="${c}" style="background:${c}" class="${(S.color||'#f2b000')==c?'on':''}"></button>`).join('')}<input type="color" id="cp" value="${S.color||'#f2b000'}"><span style="color:var(--sub);font-size:13px">自定义</span></div>
 <label>数据备份（复制保存；换设备时粘贴后导入）</label>
 <textarea id="bk" rows="4">${JSON.stringify(S)}</textarea>
 <button class="btn g" id="imp">导入（覆盖当前数据）</button>${inDet?'<button class="btn g" id="edIc">修改名称 / 图标 / 分类 / 星级目标</button><button class="btn g" id="delItem" style="color:#e5484d">删除此项目及其全部记录</button>':''}`);
 if(inDet)$('edIc').onclick=()=>editItem(cur);
 if(inDet)$('delItem').onclick=()=>{if(confirm('确定删除“'+curItem().name+'”及其全部记录？不可恢复')){S.recs=S.recs.filter(r=>r.item!=cur);S.items=S.items.filter(i=>i.id!=cur);save();close();view='home';go()}};
 $('catm').onclick=catSheet;
 $('s_g').onchange=e=>{S.group=e.target.value;save();if(view=='home')renderHome()};$('s_s').onchange=e=>{S.sort=e.target.value;save();if(view=='home')renderHome()};
 document.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{S.dayImg=b.dataset.di=='1';save();$('more').onclick();if(view=='det')render()});
 document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyPrefs();$('more').onclick()});
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.color=b.dataset.c;save();applyPrefs();$('more').onclick()});
 $('cp').oninput=e=>{S.color=e.target.value;save();applyPrefs()};
 $('imp').onclick=()=>{try{const o=JSON.parse($('bk').value);if(!Array.isArray(o.recs))throw 0;S=o;migrate();save();applyPrefs();close();view='home';go()}catch(e){alert('格式不正确')}};
};

// ---------- stats ----------
const MODES={week:'周',month:'月',quarter:'季',year:'年',all:'总'};
$('modes').innerHTML=Object.keys(MODES).map(k=>`<button data-m="${k}">${MODES[k]}</button>`).join('');
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;off=0;render()});
$('pp').onclick=()=>{off--;render()};$('np').onclick=()=>{off++;render()};

function range(md,o){
 const t=sod(new Date());
 if(md=='week'){const s=addD(addD(t,-wd(t)),o*7);return[s,addD(s,7)]}
 if(md=='month'){return[new Date(t.getFullYear(),t.getMonth()+o,1),new Date(t.getFullYear(),t.getMonth()+o+1,1)]}
 if(md=='quarter'){const q=Math.floor(t.getMonth()/3)*3+o*3;return[new Date(t.getFullYear(),q,1),new Date(t.getFullYear(),q+3,1)]}
 if(md=='year'){return[new Date(t.getFullYear()+o,0,1),new Date(t.getFullYear()+o+1,0,1)]}
 const f=R().length?sod(new Date(Math.min(...R().map(r=>r.ts)))):t;return[f,addD(t,1)]
}
function shiftYear(d,n){return new Date(d.getFullYear()+n,d.getMonth(),d.getDate())}
function sameRange(md,o){const[s,e]=range(md,o);
 if(md=='week')return[addD(s,-364),addD(e,-364)];
 return[shiftYear(s,-1),shiftYear(e,-1)]}
function calc([s,e]){
 const rs=R().filter(r=>r.ts>=s&&r.ts<e);
 const count=rs.reduce((a,r)=>a+r.n,0);
 const ds=[...new Set(rs.map(r=>dk(new Date(r.ts))))].sort();
 const today=addD(sod(new Date()),1);
 const end=e>today?today:e;
 const span=Math.max(1,Math.round((end-s)/864e5));
 let gap=null;
 if(ds.length>1){gap=(new Date(ds[ds.length-1])-new Date(ds[0]))/864e5/(ds.length-1)}
 return{count,days:ds.length,avg:count/span,gap,rs}}
function delta(c,p,d=0){
 if(p==null)return'<span class="fl">—</span>';
 if(p==0)return c==0?'<span class="fl">持平</span>':'<span class="up">▲ 新增</span>';
 const v=(c-p)/p*100;
 if(Math.abs(v)<0.05)return'<span class="fl">持平</span>';
 return v>0?`<span class="up">▲ ${v.toFixed(1)}%</span>`:`<span class="dn">▼ ${Math.abs(v).toFixed(1)}%</span>`}
const lblPrev={week:'上周',month:'上月',quarter:'上季',year:'去年',all:''};
const lblSame={week:'去年同周',month:'去年同月',quarter:'去年同季',year:'前年',all:''};
function rangeLabel(md,[s,e]){
 const f=d=>d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate());
 const l=addD(e,-1);
 if(md=='month')return s.getFullYear()+'年'+(s.getMonth()+1)+'月';
 if(md=='quarter')return s.getFullYear()+'年第'+(s.getMonth()/3+1)+'季度';
 if(md=='year')return s.getFullYear()+'年';
 return f(s)+' – '+f(l)}

function buckets(md,[s,e]){
 const out=[];let hi=-1;const sum=(x,y)=>R().filter(r=>r.ts>=x&&r.ts<y).reduce((a,r)=>a+r.n,0);
 if(md=='week'||md=='month'){for(let d=new Date(s);d<e;d=addD(d,1))out.push({l:md=='week'?WK[wd(d)].slice(1):String(d.getDate()),s:d,e:addD(d,1)})}
 else if(md=='quarter'){const y=s.getFullYear();for(let q=0;q<4;q++)out.push({l:'Q'+(q+1),s:new Date(y,q*3,1),e:new Date(y,q*3+3,1)});hi=s.getMonth()/3}
 else{let d=new Date(s.getFullYear(),s.getMonth(),1);while(d<e){const n=new Date(d.getFullYear(),d.getMonth()+1,1);out.push({l:md=='all'?String(d.getFullYear()).slice(2)+'.'+p2(d.getMonth()+1):(d.getMonth()+1)+'月',s:d,e:n});d=n}}
 out.forEach(b=>b.v=sum(b.s,b.e));
 return{bs:out,hi}}
function chartSvg({bs,hi}){
 const W=340,H=170,pad=22,mx=Math.max(1,...bs.map(b=>b.v)),bw=W/bs.length;
 const step=Math.ceil(bs.length/(bs.length>16?8:12));
 const g=bs.map((b,i)=>{const h=b.v/mx*(H-pad-20),x=i*bw+bw*0.18,y=H-pad-h,w=bw*0.64,cx=x+w/2;
  const op=hi<0||hi==i?1:0.35;
  return`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,b.v?2:0)}" rx="${Math.min(3,w/2)}" style="fill:var(--ac)" opacity="${op}"/>
  ${b.v&&bs.length<=31?`<text x="${cx}" y="${y-4}" font-size="11" text-anchor="middle" fill="currentColor">${b.v}</text>`:''}
  ${i%step==0?`<text x="${cx}" y="${H-6}" font-size="10" text-anchor="middle" fill="#999">${b.l}</text>`:''}`}).join('');
 return`<svg viewBox="0 0 ${W} ${H}">${g}<line x1="0" x2="${W}" y1="${H-pad}" y2="${H-pad}" stroke="#8884"/></svg>`}

function renderStat(){
 document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));
 const r=range(mode,off);
 $('rg').textContent=rangeLabel(mode,r);
 $('pp').style.visibility=$('np').style.visibility=mode=='all'?'hidden':'visible';
 const c=calc(r);
 $('chart').innerHTML=chartSvg(buckets(mode,r));
 const hasCmp=mode!='all';
 const P=hasCmp?calc(range(mode,off-1)):null,Y=hasCmp?calc(sameRange(mode,off)):null;
 const items=[
  ['记录次数',c.count,'次',P&&P.count,Y&&Y.count,1],
  ['记录天数',c.days,'天',P&&P.days,Y&&Y.days,1],
  ['每日平均',c.avg.toFixed(2),'次',P&&P.avg,Y&&Y.avg,1],
  ['平均间隔',c.gap==null?'–':c.gap.toFixed(1),'天',P&&P.gap,Y&&Y.gap,0]];
 $('cards').innerHTML=items.map(([t,v,u,p,y])=>{
  const cv=t=='记录次数'?c.count:t=='记录天数'?c.days:t=='每日平均'?c.avg:c.gap;
  const cmp=hasCmp&&cv!=null?`<div class="cmp">${lblPrev[mode]} ${p==null?'–':(+p).toFixed(t=='记录次数'||t=='记录天数'?0:1)} ${delta(cv,p)}<br>${lblSame[mode]} ${y==null?'–':(+y).toFixed(t=='记录次数'||t=='记录天数'?0:1)} ${delta(cv,y)}</div>`:'';
  return`<div class="card"><div class="big">${v}<span>${u}</span></div><div class="lab">${t}</div>${cmp}</div>`}).join('');
}
function render(){if(view=='home'){renderHome();return}tab==1?renderRec():renderStat()}
go();loadNative().then(()=>{applyPrefs();go()});$('gear').onclick=$('more').onclick;
</script></body></html>
